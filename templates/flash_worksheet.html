<!DOCTYPE html>
<html>
<head>
    <title>Flash Anzan - {{ worksheet.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .flash-number { font-size: 8rem; font-weight: 800; font-family: monospace; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-6">
    <div id="setup-card" class="bg-slate-800 p-8 rounded-xl max-w-md w-full text-center shadow-2xl">
        <h1 class="text-3xl font-bold mb-4">{{ worksheet.title }}</h1>
        <div class="mb-6 text-left">
            <label class="block text-sm font-medium mb-1">Student Name</label>
            <input type="text" id="student_name" required class="w-full bg-slate-700 border border-slate-600 rounded p-3 text-white">
        </div>
        <div class="mb-6 text-left">
            <label class="block text-sm font-medium mb-1">Parent/Teacher Email</label>
            <input type="email" id="parent_email" required class="w-full bg-slate-700 border border-slate-600 rounded p-3 text-white">
        </div>
        <button onclick="startSession()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-lg text-lg">Start Flash Session</button>
    </div>

    <div id="flash-card" class="hidden text-center max-w-lg w-full">
        <div class="text-slate-400 text-lg mb-4">Problem <span id="current-prob-num">1</span></div>
        <div class="bg-slate-800 rounded-2xl h-80 flex items-center justify-center border border-slate-700 mb-6">
            <div id="display-area" class="flash-number text-yellow-400">READY</div>
        </div>
        <div id="input-area" class="hidden">
            <p class="text-lg mb-2">What is the total sum?</p>
            <div class="flex gap-2 justify-center">
                <input type="number" id="student-answer" class="bg-slate-800 text-3xl font-mono text-center w-40 p-3 border border-emerald-500 rounded-lg text-white">
                <button onclick="submitAnswer()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-6 py-3 rounded-lg text-lg">Next</button>
            </div>
        </div>
    </div>

    <div id="results-card" class="hidden bg-slate-800 p-8 rounded-xl max-w-md w-full text-center">
        <h2 class="text-3xl font-bold text-emerald-400 mb-2">Session Complete!</h2>
        <p class="text-xl mb-4">Your Score: <span id="final-score" class="font-bold text-white">0</span>%</p>
        <p class="text-slate-400 text-sm">Results emailed to instructor/parent.</p>
    </div>

    <script>
        const worksheetData = {{ worksheet.problems | tojson }};
        const flashSpeed = {{ worksheet.flash_speed_ms }};
        let currentIndex = 0;
        let studentResults = [];

        function startSession() {
            if(!document.getElementById('student_name').value || !document.getElementById('parent_email').value) {
                alert("Please fill in student details."); return;
            }
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('flash-card').classList.remove('hidden');
            runProblemSequence();
        }

        function runProblemSequence() {
            document.getElementById('input-area').classList.add('hidden');
            document.getElementById('current-prob-num').innerText = currentIndex + 1;
            const problem = worksheetData[currentIndex];
            const display = document.getElementById('display-area');
            let seqIndex = 0;
            display.innerText = "READY";
            
            setTimeout(() => {
                const timer = setInterval(() => {
                    if (seqIndex < problem.sequence.length) {
                        const val = problem.sequence[seqIndex];
                        display.innerText = (val > 0) ? `+${val}` : `${val}`;
                        display.className = val < 0 ? "flash-number text-red-400" : "flash-number text-emerald-400";
                        seqIndex++;
                    } else {
                        clearInterval(timer);
                        display.innerText = "?";
                        display.className = "flash-number text-yellow-400";
                        document.getElementById('input-area').classList.remove('hidden');
                    }
                }, flashSpeed);
            }, 1000);
        }

        function submitAnswer() {
            const inputField = document.getElementById('student-answer');
            const studentVal = parseFloat(inputField.value);
            const currentProblem = worksheetData[currentIndex];
            
            studentResults.push({
                problem_id: currentProblem.id,
                sequence: currentProblem.sequence,
                correct_answer: currentProblem.answer,
                student_answer: studentVal,
                is_correct: studentVal === currentProblem.answer
            });

            inputField.value = "";
            currentIndex++;
            if (currentIndex < worksheetData.length) runProblemSequence();
            else finishSession();
        }

        async function finishSession() {
            document.getElementById('flash-card').classList.add('hidden');
            document.getElementById('results-card').classList.remove('hidden');
            const correctCount = studentResults.filter(r => r.is_correct).length;
            const score = (correctCount / worksheetData.length) * 100;
            document.getElementById('final-score').innerText = score.toFixed(0);

            await fetch(`/flash-worksheet/{{ worksheet.id }}/submit`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    student_name: document.getElementById('student_name').value,
                    parent_email: document.getElementById('parent_email').value,
                    score: score,
                    results: studentResults
                })
            });
        }
    </script>
</body>
</html>
