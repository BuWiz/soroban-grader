

        <div class="form-group">
            <label>Assignment Title:</label>
            <input type="text" placeholder="e.g. Flash Anzan Set 1" style="width: 100%;">
        </div>

        <div class="form-group">
            <label>Parsed Problems (One math expression per line):</label>
            <textarea rows="5" style="width: 100%;">5, -3, +8, +6, -4&#10;9, +1, -2, +3, -7</textarea>
        </div>

        <div class="form-group">
            <button class="btn">Publish to Students</button>
            <button class="btn btn-secondary">Save to Library (Draft)</button>
        </div>

        <hr>

        <h2>Student Grades & Automated Scoring</h2>
        <div id="student-grades-container">
            <p>Loading student scores...</p>
        </div>

        <h2>Active Student Work Library</h2>
        <div id="active-assignments-container">
            <p>Loading active assignments...</p>
        </div>

        <h2>Saved Draft Library</h2>
        <div id="draft-assignments-container">
            <p>Loading draft library...</p>
        </div>
    </div>

    <script>
    async function loadDashboard() {
      const gradesContainer = document.getElementById('student-grades-container');
      const activeContainer = document.getElementById('active-assignments-container');
      const draftsContainer = document.getElementById('draft-assignments-container');

      try {
        const [scoresRes, assignmentsRes, draftsRes] = await Promise.all([
          fetch('/api/scores'),
          fetch('/api/assignments'),
          fetch('/api/drafts')
        ]);

        const scores = await scoresRes.json();
        const assignments = await assignmentsRes.json();
        const drafts = await draftsRes.json();

        if (gradesContainer) {
          gradesContainer.innerHTML = Array.isArray(scores) && scores.length > 0 
            ? scores.map(s => `<p><strong>${s.student_name || 'Student'}:</strong> ${s.score}%</p>`).join('')
            : '<p>No student scores recorded yet.</p>';
        }

        if (activeContainer) {
          activeContainer.innerHTML = Array.isArray(assignments) && assignments.length > 0
            ? assignments.map(a => `
                <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
                  <a href="/student?assignment_id=${a.id || ''}" style="font-weight: bold; text-decoration: underline; color: #0066cc; font-size: 1.1em; cursor: pointer;">
                    ${a.title}
                  </a> 
                  <span>(${a.type || 'Worksheet'})</span>
                  <button onclick="window.location.href='/student?assignment_id=${a.id || ''}'" style="padding: 4px 10px; cursor: pointer; background-color: #0066cc; color: white; border: none; border-radius: 4px;">Assign / View</button>
                </div>
              `).join('')
            : '<p>No active assignments published.</p>';
        }

        if (draftsContainer) {
          draftsContainer.innerHTML = Array.isArray(drafts) && drafts.length > 0
            ? drafts.map(d => `
                <div style="margin-bottom: 8px;">
                  <strong>${d.title}</strong> (Draft)
                  <button style="margin-left: 10px; padding: 4px 8px; cursor: pointer;">Publish</button>
                </div>
              `).join('')
            : '<p>No saved drafts found.</p>';
        }
      } catch (e) {
        console.error('Error loading dashboard:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
