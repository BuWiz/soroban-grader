<!DOCTYPE html>
<html>
<head>
    <title>{{ worksheet.title }} - Student Solver</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow space-y-6">
        <div class="border-b pb-4">
            <h1 class="text-2xl font-bold text-slate-800">{{ worksheet.title }}</h1>
            <p class="text-slate-500 text-sm">Solve each equation using your soroban abacus and submit below.</p>
        </div>

        <form action="/worksheet/{{ worksheet.id }}/submit" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Student Name</label>
                <input type="text" name="student_name" required placeholder="Enter your full name" class="w-full border p-2 rounded">
            </div>

            <div class="space-y-4">
                {% for problem in worksheet.problems %}
                <div class="p-4 border rounded-lg bg-slate-50 flex justify-between items-center">
                    <span class="font-mono text-lg font-bold text-slate-800">{{ problem.equation }} =</span>
                    <input type="number" step="any" name="answer_{{ loop.index0 }}" required class="w-32 border border-slate-300 p-2 rounded text-right font-mono font-bold text-slate-800 bg-white">
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow">Submit Work for Grading</button>
        </form>
    </div>
</body>
</html>
